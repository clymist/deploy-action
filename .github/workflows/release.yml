# Releases from commit messages, with release-please.
#
# Every push to main updates one open "chore: release X.Y.Z" PR: the version
# (from Conventional Commits since the last release: feat → minor, fix/perf →
# patch, ! or BREAKING CHANGE → major, minor while still 0.x) and the CHANGELOG
# entry written from those commit messages. Edit the PR's CHANGELOG before
# merging to reword anything; to fix one commit's line for good, add a
# BEGIN_COMMIT_OVERRIDE block to the description of the PR that merged it.
#
# Merging the release PR tags vX.Y.Z, publishes the GitHub release, and moves
# the sliding major tag (v0, v1, …) — what users reference as
# `clymist/deploy-action@v0`. Prereleases (prerelease.yml) never move it.
#
# Token: with the default GITHUB_TOKEN, CI does not run on the release PR (GitHub
# doesn't trigger workflows from it). Set a RELEASE_PLEASE_TOKEN secret (a
# fine-grained token or GitHub App token with contents + pull-requests write) to
# get checks on it. Repo setting needed either way: Actions → General → "Allow
# GitHub Actions to create and approve pull requests".
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - id: rp
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - uses: actions/checkout@v7
        if: steps.rp.outputs.release_created == 'true'
        with:
          fetch-depth: 0

      # The sliding major tag is what `@v0` resolves to — move it last, so it
      # only advances once the release itself exists.
      - name: Move the sliding major tag
        if: steps.rp.outputs.release_created == 'true'
        env:
          TAG: ${{ steps.rp.outputs.tag_name }}
          MAJOR: v${{ steps.rp.outputs.major }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch --tags --force
          git tag -f "$MAJOR" "$TAG"
          git push origin "$MAJOR" --force
          echo "Moved $MAJOR → $TAG"
