# Keeps the sliding major tag (e.g. v1) pointing at the latest vX.Y.Z release,
# which is the tag users reference as `clymist/deploy-action@v1`.
# Run this in the standalone clymist/deploy-action repo (not the monorepo).
name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  retag-major:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move the major tag to this release
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"                 # e.g. v1.2.3
          MAJOR="${TAG%%.*}"                        # e.g. v1
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f "$MAJOR" "$TAG"
          git push origin "$MAJOR" --force
          echo "Moved $MAJOR → $TAG"
