name: Prerelease

# Every merge to main publishes an automatic prerelease, versioned from
# Conventional Commits since the last STABLE tag:
#   feat:            → minor bump
#   fix:/perf:       → patch bump
#   feat!/BREAKING   → major bump (or minor while still 0.x)
# The prerelease tag is <next>-rc.<N>, where N increments per merge within the
# same target version. Stable releases are cut manually via release.yml.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Don't stack prereleases if merges land quickly; the newest wins.
concurrency:
  group: prerelease
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  prerelease:
    runs-on: ubuntu-latest
    # Skip release/version bookkeeping commits to avoid loops.
    if: "!startsWith(github.event.head_commit.message, 'chore(release)')"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Compute next prerelease version
        id: ver
        run: |
          set -euo pipefail

          # Latest STABLE tag (no hyphen). Default to v0.0.0 if none yet.
          LAST_STABLE="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' \
            | grep -vE '\-' | sort -V | tail -n1 || true)"
          LAST_STABLE="${LAST_STABLE:-v0.0.0}"
          BASE="${LAST_STABLE#v}"
          MAJOR="${BASE%%.*}"; REST="${BASE#*.}"; MINOR="${REST%%.*}"; PATCH="${REST#*.}"

          # Inspect commits since the last stable tag to pick the bump. When no
          # stable tag exists yet, scan the whole history.
          if git rev-parse -q --verify "$LAST_STABLE" >/dev/null; then
            LOG="$(git log --format='%B' "${LAST_STABLE}..HEAD")"
          else
            LOG="$(git log --format='%B')"
          fi

          BUMP="none"
          if printf '%s' "$LOG" | grep -qE '(^|\n)(BREAKING CHANGE|.*!:)'; then
            BUMP="major"
          elif printf '%s' "$LOG" | grep -qE '(^|\n)feat(\(.+\))?:'; then
            BUMP="minor"
          elif printf '%s' "$LOG" | grep -qE '(^|\n)(fix|perf)(\(.+\))?:'; then
            BUMP="patch"
          fi
          # Nothing releasable since last stable → default to a patch prerelease.
          [ "$BUMP" = "none" ] && BUMP="patch"

          # While in 0.x, a "major" (breaking) bump only moves the minor.
          if [ "$MAJOR" -eq 0 ] && [ "$BUMP" = "major" ]; then BUMP="minor"; fi

          case "$BUMP" in
            major) MAJOR=$((MAJOR+1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR+1)); PATCH=0 ;;
            patch) PATCH=$((PATCH+1)) ;;
          esac
          TARGET="${MAJOR}.${MINOR}.${PATCH}"

          # rc counter: highest existing -rc.N for this TARGET, + 1.
          LAST_RC="$(git tag --list "v${TARGET}-rc.*" \
            | sed -E "s/^v${TARGET}-rc\.//" | sort -n | tail -n1 || true)"
          NEXT_RC=$(( ${LAST_RC:-0} + 1 ))
          TAG="v${TARGET}-rc.${NEXT_RC}"

          {
            echo "tag=$TAG"
            echo "target=$TARGET"
            echo "bump=$BUMP"
          } >> "$GITHUB_OUTPUT"
          echo "Next prerelease: $TAG (bump=$BUMP from $LAST_STABLE)"

      - name: Tag & publish prerelease
        env:
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Prerelease $TAG"
          git push origin "$TAG"

      - name: Create GitHub prerelease
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          prerelease: true
          generate_release_notes: true
