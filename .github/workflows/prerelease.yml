name: Prerelease

# Publishes a prerelease (<next>-rc.<N>) on demand, from Actions → Prerelease →
# Run workflow, for trying a change before a stable release. Versioned from
# Conventional Commits since the last STABLE tag:
#   feat:            → minor bump
#   fix:/perf:       → patch bump
#   feat!/BREAKING   → major bump (or minor while still 0.x)
# N increments per run within the same target version. It used to run on every
# merge to main, which buried the real releases under -rc tags; stable releases
# are cut via release.yml.
on:
  workflow_dispatch:

# Don't stack prereleases if runs overlap; the newest wins.
concurrency:
  group: prerelease
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  prerelease:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Shared with release.yml (scripts/next-version.sh) so an rc and the stable
      # release it becomes always compute the same target version.
      - name: Compute next prerelease version
        id: ver
        run: |
          set -euo pipefail
          TAG="$(./scripts/next-version.sh --rc)"
          {
            echo "tag=$TAG"
            echo "target=${TAG%-rc.*}"
          } >> "$GITHUB_OUTPUT"
          echo "Next prerelease: $TAG"

      - name: Tag & publish prerelease
        env:
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Prerelease $TAG"
          git push origin "$TAG"

      - name: Create GitHub prerelease
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          prerelease: true
          generate_release_notes: true
