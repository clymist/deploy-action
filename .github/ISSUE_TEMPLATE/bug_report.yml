name: Bug report
description: Something went wrong using clymist/deploy-action
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: Thanks for the report! Please do NOT paste tokens or secrets.
  - type: input
    id: version
    attributes:
      label: Action version
      description: e.g. clymist/deploy-action@v1 (or a specific SHA/tag)
      placeholder: v1
    validations:
      required: true
  - type: textarea
    id: workflow
    attributes:
      label: Relevant workflow snippet
      description: The job/step using the action (redact secrets).
      render: yaml
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Action logs
      description: The failing step's output (redact tokens; the OIDC token is sensitive).
      render: shell
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
