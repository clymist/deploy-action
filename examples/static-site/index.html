<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Deployed with clymist/deploy-action</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: -apple-system, Segoe UI, Roboto, sans-serif;
        background: #0f172a;
        color: #e2e8f0;
      }
      .card {
        text-align: center;
        padding: 2.5rem 3rem;
        border: 1px solid #1e293b;
        border-radius: 16px;
        background: #111827;
      }
      h1 { margin: 0 0 0.5rem; font-size: 1.6rem; }
      p { margin: 0.25rem 0; color: #94a3b8; }
      .badge {
        display: inline-block;
        margin-top: 1rem;
        padding: 0.35rem 0.8rem;
        border-radius: 999px;
        background: #2563eb;
        color: #fff;
        font-size: 0.8rem;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>🚀 Deployed via CI</h1>
      <p>This static site was shipped by <strong>clymist/deploy-action</strong>.</p>
      <p>OIDC-authenticated — no secrets stored.</p>
      <span class="badge">Clymist</span>
    </div>
  </body>
</html>
